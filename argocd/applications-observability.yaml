# Fase 4 — Stack de Observabilidade (Prometheus, Loki, OTel Collector, dashboards)
#
# Mantido em arquivo separado de applications.yaml por organização (um arquivo
# por responsabilidade: apps de negócio vs. stack de observabilidade). Aplicar
# com:
#   kubectl apply -f argocd/applications-observability.yaml
---
# Prometheus + Grafana + Alertmanager (kube-prometheus-stack)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "91.8.2"
    helm:
      releaseName: prometheus
      values: |
        # No EBS CSI driver in this cluster (workloads are designed to be
        # stateless — see modules/eks comment). Prometheus/Alertmanager fall
        # back to emptyDir: fine for this lab/demo deployment, data does not
        # survive a pod restart.
        prometheus:
          prometheusSpec:
            retention: 3d
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1Gi

        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi

        prometheusOperator:
          admissionWebhooks:
            enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

        grafana:
          service:
            type: LoadBalancer
          # Credenciais fixas num Secret criado fora do GitOps (kubectl, nao
          # versionado). Sem isso o chart gera uma senha aleatoria nova a
          # cada sync do ArgoCD (nao ha estado de release do Helm no
          # GitOps), trocando a senha de acesso a cada reconciliacao.
          admin:
            existingSecret: prometheus-grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              # 256Mi was OOMKilling under normal dashboard usage (multiple
              # panels querying concurrently + plugin loading).
              memory: 512Mi
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              jsonData:
                maxLines: 1000

        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Prometheus Operator's CRDs exceed the 262144-byte annotation limit
      # that client-side apply hits via kubectl.kubernetes.io/last-applied-configuration.
      - ServerSideApply=true
---
# Loki — centralização e indexação de logs (recebe via OTel Collector, nao via
# Promtail/Grafana Agent)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: "7.3.0"
    helm:
      releaseName: loki
      values: |
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            allow_structured_metadata: true
            retention_period: 24h

        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # No EBS CSI driver in this cluster — see note in kube-prometheus-stack
          # above. The chart does not fall back to emptyDir automatically when
          # persistence is disabled (it just omits the /var/loki mount), so we
          # add one explicitly — logs are lost on pod restart.
          persistence:
            enabled: false
          extraVolumes:
            - name: storage
              emptyDir: {}
          extraVolumeMounts:
            - name: storage
              mountPath: /var/loki

        write:
          replicas: 0
        read:
          replicas: 0
        backend:
          replicas: 0

        gateway:
          enabled: false

        test:
          enabled: false

        lokiCanary:
          enabled: false

        monitoring:
          serviceMonitor:
            enabled: true
            labels:
              release: prometheus
          selfMonitoring:
            enabled: false
          lokiCanary:
            enabled: false

        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        minio:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# OTel Collector — peça central de telemetria (Fase 4, requisito 2).
#
# Fluxo:
#   microsservicos --OTLP/HTTP (4318)--> otel-collector (DaemonSet, 1 por no)
#     traces  -> New Relic APM (OTLP nativo) + debug
#     metrics -> exporter Prometheus (:8889) <- scrape via ServiceMonitor
#     logs    -> Loki (ingestao OTLP nativa, /otlp)
#   + filelog: logs de stdout de TODOS os outros containers do cluster -> Loki
#
# Os 5 microsservicos enviam os proprios logs via OTLP (com trace_id/span_id
# para correlacao log <-> trace), por isso os namespaces deles sao excluidos do
# filelog — senao cada linha chegaria duplicada no Loki.
#
# Os servicos apontam para o Service "otel-collector" (internalTrafficPolicy:
# Local por padrao em modo daemonset), entao cada pod fala com o collector do
# proprio no — requisito do k8sattributes, que em daemonset so observa os pods
# do seu no. Padrao de env vars dos servicos: ver docs/OTEL.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.174.0"
    helm:
      releaseName: otel-collector
      values: |
        # Nome estavel e curto para o Service:
        #   otel-collector.monitoring.svc.cluster.local
        fullnameOverride: otel-collector

        mode: daemonset

        image:
          repository: otel/opentelemetry-collector-contrib

        # License key do New Relic (APM). Secret criado FORA do Git:
        #   kubectl -n monitoring create secret generic newrelic-license \
        #     --from-literal=license-key=<INGEST - LICENSE key>
        # optional: true -> se o Secret ainda nao existir o collector sobe
        # mesmo assim (so o export para o New Relic falha com 403); metricas
        # e logs para Prometheus/Loki nao sao afetados. Ver docs/APM.md.
        extraEnvs:
          - name: NEW_RELIC_LICENSE_KEY
            valueFrom:
              secretKeyRef:
                name: newrelic-license
                key: license-key
                optional: true

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            # 256Mi era suficiente so para filelog; com traces/metricas/logs
            # OTLP dos 5 servicos passando por aqui, damos folga. O
            # memory_limiter (80% do limit) protege contra OOMKill.
            memory: 384Mi

        clusterRole:
          create: true
          rules:
            - apiGroups: [""]
              resources: ["pods", "namespaces", "nodes"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["apps"]
              resources: ["replicasets"]
              verbs: ["get", "list", "watch"]

        presets:
          logsCollection:
            enabled: true
            includeCollectorLogs: false
          kubernetesAttributes:
            enabled: true
          hostMetrics:
            enabled: true

        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
            # Mesclado sobre o receiver criado pelo preset logsCollection.
            # Os microsservicos ja mandam logs via OTLP (ver cabecalho).
            filelog:
              exclude:
                - /var/log/pods/monitoring_otel-collector*_*/opentelemetry-collector/*.log
                - /var/log/pods/auth-service_*/*/*.log
                - /var/log/pods/flag-service_*/*/*.log
                - /var/log/pods/targeting-service_*/*/*.log
                - /var/log/pods/evaluation-service_*/*/*.log
                - /var/log/pods/analytics-service_*/*/*.log

          processors:
            # memory_limiter e batch ja vem com defaults do chart; repetidos
            # aqui so para deixar o pipeline explicito.
            memory_limiter:
              check_interval: 5s
              limit_percentage: 80
              spike_limit_percentage: 25
            batch:
              send_batch_size: 1024
              timeout: 5s
            # Tags comuns a toda telemetria que passa pelo collector.
            resource:
              attributes:
                - key: deployment.environment
                  value: prod
                  action: upsert
                - key: k8s.cluster.name
                  value: tech-challenge-prod-eks
                  action: upsert

          exporters:
            otlphttp/loki:
              endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
              tls:
                insecure: true
            prometheus:
              endpoint: 0.0.0.0:8889
              # Converte atributos de resource (service.name,
              # k8s.namespace.name, k8s.pod.name...) em labels — sem isso as
              # metricas chegam sem identificar de qual servico vieram.
              resource_to_telemetry_conversion:
                enabled: true
              # Remove series de pods que sumiram (rollout/restart).
              metric_expiration: 5m
            debug:
              verbosity: basic
            # APM (Fase 4, requisito 3): New Relic recebe OTLP nativamente,
            # sem exporter proprietario. O exporter acrescenta /v1/traces ao
            # endpoint. Conta na regiao EU: https://otlp.eu01.nr-data.net
            otlphttp/newrelic:
              endpoint: https://otlp.nr-data.net
              compression: gzip
              headers:
                api-key: ${env:NEW_RELIC_LICENSE_KEY}

          service:
            pipelines:
              logs:
                receivers: [otlp]   # + filelog (adicionado pelo preset)
                processors: [memory_limiter, k8sattributes, resource, batch]
                exporters: [otlphttp/loki]
              metrics:
                receivers: [otlp]   # + hostmetrics (adicionado pelo preset)
                processors: [memory_limiter, k8sattributes, resource, batch]
                exporters: [prometheus]
              traces:
                receivers: [otlp]
                processors: [memory_limiter, k8sattributes, resource, batch]
                # debug: resumo por lote no log do collector (validacao);
                # otlphttp/newrelic: APM (trace distribuido + Service Map).
                exporters: [debug, otlphttp/newrelic]

        ports:
          # Telemetria interna do proprio collector (otelcol_*)
          metrics:
            enabled: true
          # Exporter Prometheus com as metricas dos microsservicos
          prom-exporter:
            enabled: true
            containerPort: 8889
            servicePort: 8889
            protocol: TCP
          # Nao usados — so OTLP. Evita abrir hostPorts a toa em cada no.
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false

        service:
          enabled: true

        serviceMonitor:
          enabled: true
          extraLabels:
            release: prometheus
          # A ordem importa: o chart aplica metricRelabelings ao ULTIMO
          # endpoint da lista (prom-exporter).
          metricsEndpoints:
            - port: metrics
            - port: prom-exporter
              interval: 15s
              honorLabels: true
          # O Prometheus rotula tudo que vem do collector com o namespace/pod
          # DO COLLECTOR (monitoring/otel-collector-xxx). Para as metricas
          # das apps, sobrescreve namespace/pod com os do servico de origem
          # (vindos do OTel) — e o que o dashboard filtra.
          metricRelabelings:
            - sourceLabels: [k8s_namespace_name]
              regex: (.+)
              targetLabel: namespace
              replacement: $1
              action: replace
            - sourceLabels: [k8s_pod_name]
              regex: (.+)
              targetLabel: pod
              replacement: $1
              action: replace
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Dashboard customizado do Grafana (saude do cluster + request rate + logs)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-extras
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pos-Tech-DevOps-DCLT/infra-tc4.git
    targetRevision: main
    path: charts/observability-extras
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
