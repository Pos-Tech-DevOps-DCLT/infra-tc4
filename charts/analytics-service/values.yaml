replicaCount: 0

image:
  repository: 630013977255.dkr.ecr.us-east-1.amazonaws.com/tech-challenge-prod/analytics-service
  tag: "b7e706e-fix1"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8005

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

livenessProbe:
  httpGet:
    path: /health
    port: 8005
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: 8005
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

serviceAccount:
  create: true
  name: analytics-service

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

keda:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  pollingInterval: 30
  cooldownPeriod: 300
  queueLength: 5

namespace: analytics-service
