# ServiceAccount do analytics-service com IRSA (IAM Roles for Service Accounts)
# O IRSA permite que o pod acesse SQS e DynamoDB sem credenciais AWS estáticas
# A role foi criada pelo módulo terraform/modules/irsa/
#
# Como obter o ARN da role:
#   cd terraform && terraform output -raw irsa_analytics_service_role_arn

apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service
  namespace: analytics-service
  labels:
    app: analytics-service
    version: "1.0"
  annotations:
    # Substitua pelo ARN real: terraform output -raw irsa_analytics_service_role_arn
    eks.amazonaws.com/role-arn: arn:aws:iam::630013977255:role/tech-challenge-prod-analytics-service
