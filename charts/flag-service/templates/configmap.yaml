# ConfigMap do flag-service
# Contém variáveis NÃO sensíveis
apiVersion: v1
kind: ConfigMap
metadata:
  name: flag-service-config
  namespace: flag-service
  labels:
    app: flag-service
    version: "1.0"
data:
  PORT: "8002"
  # DNS interno do auth-service (namespace = nome do serviço)
  AUTH_SERVICE_URL: "http://auth-service.auth-service.svc.cluster.local:8001"

  # --- OpenTelemetry (padrao comum aos 5 servicos — ver docs/OTEL.md) ---
  OTEL_SERVICE_NAME: "flag-service"
  # Service do collector (DaemonSet, internalTrafficPolicy: Local)
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_SAMPLER: "parentbased_always_on"
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
  OTEL_PROPAGATORS: "tracecontext,baggage"
