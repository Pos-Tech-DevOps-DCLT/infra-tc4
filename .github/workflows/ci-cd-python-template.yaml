name: CI/CD Python TC3

on:
  workflow_call:
    inputs:
      project:
        description: 'Nome da imagem do projeto dentro do ECR'
        required: true
        type: string

jobs:
  build-and-test:
    name: 🔍 1 · Testes Unitários
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências de teste
        run: pip install -r requirements-test.txt

      - name: Executar testes com cobertura
        run: |
          pytest tests/ -v \
            --junitxml=test-results.xml \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Publicar resultados dos testes no Job Summary
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml

      - name: Publicar cobertura no Job Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: coverage.xml
          format: markdown
          output: both

      - name: Adicionar cobertura ao Job Summary
        if: always()
        run: |
          echo "## 📈 Cobertura de Código" >> $GITHUB_STEP_SUMMARY
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "⚠️ Relatório de cobertura não encontrado." >> $GITHUB_STEP_SUMMARY

      - name: Complexidade ciclomática (radon)
        if: always()
        run: |
          echo "## 🔬 Complexidade Ciclomática" >> $GITHUB_STEP_SUMMARY
          echo "| Função | Arquivo | Score | Rank |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|-------|------|" >> $GITHUB_STEP_SUMMARY
          radon cc app.py -s --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          rows = []
          for fname, blocks in data.items():
              short = fname.split(chr(47))[-1]
              for b in blocks:
                  rows.append((b[\"complexity\"], b[\"name\"], short, b[\"rank\"]))
          rows.sort(reverse=True)
          for score, name, f, rank in rows[:10]:
              icon = \"🔴\" if score >= 10 else (\"🟡\" if score >= 5 else \"🟢\")
              print(f\"| \`{name}\` | \`{f}\` | {icon} {score} | {rank} |\")
          " >> $GITHUB_STEP_SUMMARY
          radon cc app.py -s -a

      - name: Publicar artefatos de teste
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.project }}-test-reports
          path: |
            test-results.xml
            coverage.xml
          retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # JOB 2 — Lint / Análise Estática (paralelo ao build-and-test)
  # ══════════════════════════════════════════════════════════════
  lint:
    name: 🔍 2 · Lint / Análise Estática
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar flake8
        run: pip install flake8==7.1.1

      - name: Executar flake8 e publicar no Job Summary
        run: |
          RAW=$(flake8 app.py --max-line-length=120 --statistics 2>&1) || true
          COUNT=$(flake8 app.py --max-line-length=120 --count --quiet 2>/dev/null | tail -1)
          COUNT=${COUNT:-0}

          echo "## 🔍 Lint — flake8" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$COUNT" -eq 0 ]; then
            echo "### ✅ 0 problemas encontrados" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ $COUNT problema(s) encontrado(s) — não bloqueia a pipeline" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severidade | Código | Descrição | Ocorrências |" >> $GITHUB_STEP_SUMMARY
            echo "|:---:|:---|:---|---:|" >> $GITHUB_STEP_SUMMARY
            echo "$RAW" | grep -E '^[[:space:]]*[0-9]+[[:space:]]+[A-Z][0-9]+' | while IFS= read -r line; do
              N=$(echo "$line" | awk '{print $1}')
              CODE=$(echo "$line" | awk '{print $2}')
              DESC=$(echo "$line" | cut -d' ' -f3-)
              case "$CODE" in
                E*|F*) ICON="🔴" ;;
                W*)    ICON="🟡" ;;
                C*)    ICON="🔵" ;;
                *)     ICON="⚪" ;;
              esac
              echo "| $ICON | \`$CODE\` | $DESC | $N |" >> $GITHUB_STEP_SUMMARY
            done || true
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>📄 Ver ocorrências detalhadas</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$RAW" | grep -E '^[^[:space:]]+:[0-9]+:[0-9]+:' >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

          echo "$RAW"

  # ══════════════════════════════════════════════════════════════
  # JOB 3 — Scan de Vulnerabilidades com Trivy - SCA
  # ══════════════════════════════════════════════════════════════
  trivy-scan:
    name: 🔍 3 · SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy — scan e publicar no Job Summary
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy — salvar relatório JSON
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-sca-results.json'

      - name: Publicar resumo no Job Summary
        if: always()
        run: |
          echo "## 🛡️ SCA — Trivy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f trivy-sca-results.json ]; then
            echo "⚠️ Relatório não encontrado — verificação pulada." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          COUNTS=$(python3 -c "
          import json
          with open('trivy-sca-results.json') as f:
              data = json.load(f)
          sev = {'CRITICAL': 0, 'HIGH': 0, 'MEDIUM': 0, 'LOW': 0, 'UNKNOWN': 0}
          for result in data.get('Results') or []:
              for v in result.get('Vulnerabilities') or []:
                  s = v.get('Severity', 'UNKNOWN')
                  sev[s] = sev.get(s, 0) + 1
          print(sum(sev.values()))
          for k in ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'UNKNOWN']:
              print(sev[k])
          ")
          TOTAL=$(echo "$COUNTS" | sed -n '1p')
          CRITICAL_COUNT=$(echo "$COUNTS" | sed -n '2p')
          HIGH_COUNT=$(echo "$COUNTS" | sed -n '3p')
          MEDIUM_COUNT=$(echo "$COUNTS" | sed -n '4p')
          LOW_COUNT=$(echo "$COUNTS" | sed -n '5p')
          UNKNOWN_COUNT=$(echo "$COUNTS" | sed -n '6p')

          echo "### 📊 Total: $TOTAL vulnerabilidade(s)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severidade | Ocorrências |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL | $CRITICAL_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 HIGH | $HIGH_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM | $MEDIUM_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 LOW | $LOW_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚪ UNKNOWN | $UNKNOWN_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "<details><summary>📄 Ver CRITICAL / HIGH detalhados</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severidade | Pacote | Instalada | Corrigida | CVE |" >> $GITHUB_STEP_SUMMARY
          echo "|:---:|:---|:---|:---|:---|" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          with open('trivy-sca-results.json') as f:
              data = json.load(f)
          icon = {'CRITICAL': '🔴', 'HIGH': '🟠'}
          for result in data.get('Results') or []:
              for v in result.get('Vulnerabilities') or []:
                  s = v.get('Severity', 'UNKNOWN')
                  if s in icon:
                      fixed = v.get('FixedVersion') or '—'
                      print(f\"| {icon[s]} {s} | \`{v.get('PkgName')}\` | {v.get('InstalledVersion')} | {fixed} | {v.get('VulnerabilityID')} |\")
          " >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Publicar relatório do Trivy
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.project }}-trivy-report
          path: trivy-sca-results.json
          retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # JOB 4 — Scan de Vulnerabilidades com Horusec - SAST
  # ══════════════════════════════════════════════════════════════
  horusec:
    name: "🔍 4 · SAST (Horusec)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Horusec
        uses: fike/horusec-action@v0.2.2
        continue-on-error: true
        with:
          arguments: >
            -p ./
            -o json
            -O horusec-results.json
            --ignore-severity LOW
            -i "**/README.md"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horusec-report
          path: horusec-results.json
          retention-days: 30

      - name: Bloquear em vulnerabilidade Crítica
        if: always()
        run: |
          echo "## 🔍 SAST — Horusec" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f horusec-results.json ]; then
            echo "⚠️ Relatório não encontrado — verificação pulada." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          TOTAL=$(grep -oE '"severity"[[:space:]]*:[[:space:]]*"[A-Z]+"' horusec-results.json | wc -l)
          CRITICAL_COUNT=$(grep -o '"severity"[[:space:]]*:[[:space:]]*"CRITICAL"' horusec-results.json | wc -l)
          HIGH_COUNT=$(grep -o '"severity"[[:space:]]*:[[:space:]]*"HIGH"' horusec-results.json | wc -l)
          MEDIUM_COUNT=$(grep -o '"severity"[[:space:]]*:[[:space:]]*"MEDIUM"' horusec-results.json | wc -l)
          LOW_COUNT=$(grep -o '"severity"[[:space:]]*:[[:space:]]*"LOW"' horusec-results.json | wc -l)
          INFO_COUNT=$(grep -o '"severity"[[:space:]]*:[[:space:]]*"INFO"' horusec-results.json | wc -l)

          echo "### 📊 Total: $TOTAL vulnerabilidade(s)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severidade | Ocorrências |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL | $CRITICAL_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 HIGH | $HIGH_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM | $MEDIUM_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 LOW | $LOW_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚪ INFO | $INFO_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL_COUNT" -gt 10 ]; then
            echo "❌ **Pipeline bloqueada** — $CRITICAL_COUNT vulnerabilidade(s) CRITICAL encontrada(s) (limite: 10)." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ $CRITICAL_COUNT vulnerabilidade(s) CRITICAL — dentro do limite de 10." >> $GITHUB_STEP_SUMMARY
          fi

  # ══════════════════════════════════════════════════════════════
  # JOB 5 — Docker Build (aguarda jobs 1 e 2)
  # ══════════════════════════════════════════════════════════════
  docker-build:
    name: 5 · Docker Build
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, trivy-scan, horusec]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ inputs.project }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/${{ inputs.project }}.tar

      - name: Publicar imagem Docker
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-docker-image
          path: /tmp/${{ inputs.project }}.tar
          retention-days: 1


  # ══════════════════════════════════════════════════════════════
  # JOB 6 — Push para AWS ECR (somente na branch main)
  # Requer secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  # ══════════════════════════════════════════════════════════════
  push-ecr:
    name: 6 · Push para AWS ECR
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Baixar imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.project }}-docker-image
          path: /tmp

      - run: docker load --input /tmp/${{ inputs.project }}.tar

      - name: Tag e push para ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tech-challenge-prod/${{ inputs.project }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo $IMAGE_TAG | cut -c1-7)
          docker tag ${{ inputs.project }}:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA
          echo "✅ Imagem publicada: $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════
  # JOB 7 — Atualização automática do GitOps (CD)
  #
  # Escreve a tag da imagem recém-publicada no ECR em
  # charts/<project>/values.yaml do repositório GitOps (infra-tc4).
  # O ArgoCD, com syncPolicy automated, detecta o commit e sincroniza
  # a nova versão no cluster sem nenhuma ação manual.
  #
  # Requer o secret GITOPS_TOKEN — PAT fine-grained com permissão
  # "Contents: Read and write" no repositório infra-tc4. O GITHUB_TOKEN
  # padrão NÃO serve: ele só tem poder no repositório que dispara o run.
  # ══════════════════════════════════════════════════════════════
  update-gitops:
    name: "7 · Atualizar GitOps (CD)"
    runs-on: ubuntu-latest
    needs: push-ecr
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    # Serializa runs do mesmo microsserviço. Corridas entre repositórios
    # diferentes (5 CIs terminando juntos) são tratadas pelo retry com
    # rebase no passo de push — concurrency group não cruza repositórios.
    concurrency:
      group: gitops-bump-${{ github.repository }}
      cancel-in-progress: false
    env:
      PROJECT: ${{ inputs.project }}
      GITOPS_REPO: Pos-Tech-DevOps-DCLT/infra-tc4
    steps:
      - name: Validar secret GITOPS_TOKEN
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "${GITOPS_TOKEN:-}" ]; then
            echo "::error title=Secret GITOPS_TOKEN ausente::Crie um PAT fine-grained com 'Contents: Read and write' em ${GITOPS_REPO} e salve como secret GITOPS_TOKEN (nivel de organizacao, ou em cada repositorio de microsservico)."
            exit 1
          fi
          echo "✅ GITOPS_TOKEN presente."

      - name: Checkout do repositório GitOps
        uses: actions/checkout@v4
        with:
          repository: Pos-Tech-DevOps-DCLT/infra-tc4
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          # Histórico completo: o rebase do retry precisa dele.
          fetch-depth: 0

      - name: Calcular tag da imagem
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "value=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Tag calculada: $SHORT_SHA"

      - name: Atualizar image.tag no values.yaml
        id: bump
        working-directory: gitops
        env:
          NEW_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          VALUES="charts/${PROJECT}/values.yaml"

          if [ ! -f "$VALUES" ]; then
            echo "::error title=Chart nao encontrado::$VALUES nao existe em ${GITOPS_REPO}."
            exit 1
          fi

          OLD_TAG=$(yq -r '.image.tag' "$VALUES")
          IMAGE_REPO=$(yq -r '.image.repository' "$VALUES")

          echo "Arquivo .....: $VALUES"
          echo "Imagem ......: $IMAGE_REPO"
          echo "Tag atual ...: $OLD_TAG"
          echo "Tag nova ....: $NEW_TAG"

          {
            echo "values=$VALUES"
            echo "old_tag=$OLD_TAG"
            echo "image=$IMAGE_REPO:$NEW_TAG"
          } >> "$GITHUB_OUTPUT"

          if [ "$OLD_TAG" = "$NEW_TAG" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ values.yaml já está em $NEW_TAG — nada a commitar."
            exit 0
          fi

          # Edição cirúrgica com sed: preserva comentários e linhas em branco
          # do arquivo. (yq -i reescreve o YAML inteiro e polui o diff.)
          # Guarda: a chave 'tag:' precisa ser única dentro do values.yaml.
          OCCURRENCES=$(grep -cE '^[[:space:]]*tag:' "$VALUES")
          if [ "$OCCURRENCES" -ne 1 ]; then
            echo "::error title=values.yaml inesperado::Encontradas $OCCURRENCES chaves 'tag:' em $VALUES — esperava exatamente 1. Revise o job 7 antes de prosseguir."
            exit 1
          fi

          # Aspas obrigatórias: tags como '1234567' ou '1e5' seriam lidas
          # como número/float e quebrariam o manifesto.
          sed -i -E "s|^([[:space:]]*)tag:.*|\1tag: \"${NEW_TAG}\"|" "$VALUES"

          # Verificação com parser YAML de verdade: arquivo válido, valor certo
          # e no caminho certo (.image.tag) — confirma que o sed acertou a linha.
          WROTE=$(yq -r '.image.tag' "$VALUES")
          if [ "$WROTE" != "$NEW_TAG" ]; then
            echo "::error title=Falha na escrita::Esperado '$NEW_TAG', encontrado '$WROTE'."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git --no-pager diff -- "$VALUES"

      - name: Commit e push no repositório GitOps
        if: steps.bump.outputs.changed == 'true'
        working-directory: gitops
        env:
          NEW_TAG: ${{ steps.tag.outputs.value }}
          VALUES: ${{ steps.bump.outputs.values }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$VALUES"
          git commit \
            -m "chore(${PROJECT}): atualiza image.tag para ${NEW_TAG} [skip ci]" \
            -m "Origem: ${{ github.repository }}@${{ github.sha }}" \
            -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Retry com rebase: se outro microsserviço commitou no meio do
          # caminho, o push é rejeitado — rebase por cima e tenta de novo.
          for ATTEMPT in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ Push concluído na tentativa $ATTEMPT."
              exit 0
            fi
            echo "⚠️ Push rejeitado (tentativa $ATTEMPT) — rebase e nova tentativa."
            git pull --rebase --autostash origin main
            sleep $((ATTEMPT * 3))
          done

          echo "::error title=Push falhou::Nao foi possivel atualizar ${GITOPS_REPO} apos 5 tentativas."
          exit 1

      - name: Publicar resumo no Job Summary
        if: always()
        env:
          NEW_TAG: ${{ steps.tag.outputs.value }}
          OLD_TAG: ${{ steps.bump.outputs.old_tag }}
          VALUES: ${{ steps.bump.outputs.values }}
          IMAGE: ${{ steps.bump.outputs.image }}
          CHANGED: ${{ steps.bump.outputs.changed }}
        run: |
          echo "## 🚀 CD — Atualização automática do GitOps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${CHANGED:-}" = "true" ]; then
            echo "### ✅ Tag atualizada no repositório GitOps" >> $GITHUB_STEP_SUMMARY
          elif [ "${CHANGED:-}" = "false" ]; then
            echo "### ℹ️ Nenhuma mudança — a tag já estava atualizada" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Falha ao atualizar o repositório GitOps" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|:---|" >> $GITHUB_STEP_SUMMARY
          echo "| Microsserviço | \`${PROJECT}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Repositório GitOps | \`${GITOPS_REPO}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Arquivo alterado | \`${VALUES:-—}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag anterior | \`${OLD_TAG:-—}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag nova | \`${NEW_TAG:-—}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem | \`${IMAGE:-—}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${CHANGED:-}" = "true" ]; then
            echo "O ArgoCD (\`syncPolicy: automated\`) detecta o commit em até ~3 minutos e sincroniza a nova versão no cluster automaticamente." >> $GITHUB_STEP_SUMMARY
          fi
